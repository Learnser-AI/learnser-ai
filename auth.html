<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In & Register | Learnser AI</title>
    
    <script src="theme.js?v=2.0"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #818cf8;
            --primary-hover: #6366f1;
            --accent: #2dd4bf;
            --danger: #ef4444;
            --bg: #020617;
            --card-bg: rgba(15, 23, 42, 0.5);
            --text-main: #f1f5f9;
            --text-dim: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(15, 23, 42, 0.85);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-x: hidden;
            position: relative;
        }

        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle at 20% 20%, var(--bg-gradient-1, rgba(129, 140, 248, 0.07)) 0%, transparent 40%),
                              radial-gradient(circle at 80% 80%, var(--bg-gradient-2, rgba(45, 212, 191, 0.06)) 0%, transparent 40%);
            z-index: -1;
            pointer-events: none;
        }

        /* Particles Background */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            z-index: 10;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 24px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-main);
        }

        .logo span {
            color: var(--accent);
        }

        .logo-subtitle {
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-top: 4px;
        }

        .auth-card {
            background: var(--card-bg);
            backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid var(--glass-border);
            margin-bottom: 28px;
            gap: 16px;
        }

        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 1rem;
            font-weight: 700;
            padding: 12px 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            text-align: center;
        }

        .tab-btn.active {
            color: var(--primary);
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--primary);
            border-radius: 2px;
            animation: slideIn 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        @keyframes slideIn {
            from { transform: scaleX(0); }
            to { transform: scaleX(1); }
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-dim);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.15);
            background: rgba(129, 140, 248, 0.05);
        }

        .btn-submit {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            background: var(--text-dim);
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Alerts & Status UI */
        .alert {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
            animation: shake 0.4s ease;
        }

        .alert.success {
            background: rgba(45, 212, 191, 0.1);
            border: 1px solid rgba(45, 212, 191, 0.2);
            color: var(--accent);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        /* Spinner */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer-link {
            text-align: center;
            margin-top: 20px;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .footer-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }

        /* Google Sign-In & Divider Styling */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 24px 0;
            color: var(--text-dim);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--glass-border);
        }

        .divider:not(:empty)::before {
            margin-right: 1em;
        }

        .divider:not(:empty)::after {
            margin-left: 1em;
        }

        .btn-google {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            border: 1px solid var(--glass-border);
            padding: 12px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
        }

        .btn-google:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        .btn-google:active {
            transform: translateY(0);
        }

        .btn-google svg {
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="auth-container">
        <div class="logo-section">
            <div class="logo">LEARNSER <span>AI</span></div>
            <div class="logo-subtitle">Your Intelligent Study Command Center</div>
        </div>

        <div class="auth-card">
            <div class="tabs">
                <button class="tab-btn active" id="tab-login-btn">Log In</button>
                <button class="tab-btn" id="tab-signup-btn">Sign Up</button>
            </div>

            <!-- Error/Success Alert Alert -->
            <div class="alert" id="auth-alert"></div>

            <!-- Login Form -->
            <form id="login-form">
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <input type="email" id="login-email" required placeholder="you@example.com">
                </div>
                <div class="form-group" style="margin-bottom: 24px;">
                    <label for="login-password">Password</label>
                    <input type="password" id="login-password" required placeholder="••••••••" minlength="6">
                </div>
                <button type="submit" class="btn-submit" id="login-submit-btn">
                    <span class="spinner" id="login-spinner"></span>
                    <span id="login-btn-text">Sign In</span>
                </button>
            </form>

            <!-- Sign Up Form -->
            <form id="signup-form" style="display: none;">
                <div class="form-group">
                    <label for="signup-name">Full Name</label>
                    <input type="text" id="signup-name" placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" required placeholder="you@example.com">
                </div>
                <div class="form-group" style="margin-bottom: 24px;">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" required placeholder="Min. 6 characters" minlength="6">
                </div>
                <button type="submit" class="btn-submit" id="signup-submit-btn">
                    <span class="spinner" id="signup-spinner"></span>
                    <span id="signup-btn-text">Create Account</span>
                </button>
            </form>

            <div class="divider">— OR —</div>

            <button type="button" class="btn-google" id="btn-google-login">
                <svg viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
                </svg>
                <span>Sign in with Google</span>
            </button>

            <div class="footer-link">
                <a href="index.html">← Back to Landing Page</a>
            </div>
        </div>
    </div>

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="auth-check.js"></script>

    <script>
        // --- BACKGROUND particles ANIMATION ---
        const canvas = document.getElementById('bg-canvas'), ctx = canvas.getContext('2d');
        let dots = [], spacing = 35;
        function initBg() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            dots = [];
            for (let x = spacing / 2; x < canvas.width; x += spacing)
                for (let y = spacing / 2; y < canvas.height; y += spacing)
                    dots.push({ x, y, baseX: x, baseY: y });
        }
        function animateBg() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            dots.forEach(d => {
                ctx.fillStyle = 'rgba(129, 140, 248, 0.08)';
                ctx.beginPath(); ctx.arc(d.x, d.y, 1.2, 0, Math.PI * 2); ctx.fill();
            });
            requestAnimationFrame(animateBg);
        }
        window.addEventListener('resize', initBg); initBg(); animateBg();

        // --- AUTH FORMS SWITCHING ---
        const tabLoginBtn = document.getElementById('tab-login-btn');
        const tabSignupBtn = document.getElementById('tab-signup-btn');
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');
        const alertEl = document.getElementById('auth-alert');

        tabLoginBtn.addEventListener('click', () => {
            tabLoginBtn.classList.add('active');
            tabSignupBtn.classList.remove('active');
            loginForm.style.display = 'block';
            signupForm.style.display = 'none';
            alertEl.style.display = 'none';
        });

        tabSignupBtn.addEventListener('click', () => {
            tabSignupBtn.classList.add('active');
            tabLoginBtn.classList.remove('active');
            signupForm.style.display = 'block';
            loginForm.style.display = 'none';
            alertEl.style.display = 'none';
        });

        function showAlert(message, type = 'error') {
            alertEl.innerText = message;
            alertEl.style.display = 'block';
            if (type === 'success') {
                alertEl.classList.add('success');
            } else {
                alertEl.classList.remove('success');
            }
        }

        // --- SUBMIT HANDLING ---

        // LOGIN SUBMIT
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertEl.style.display = 'none';

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const submitBtn = document.getElementById('login-submit-btn');
            const spinner = document.getElementById('login-spinner');
            const btnText = document.getElementById('login-btn-text');

            const supabase = window.supabaseClient;
            if (!supabase) {
                showAlert("Supabase client not initialized.");
                return;
            }

            // Enter loading state
            submitBtn.disabled = true;
            spinner.style.display = 'block';
            btnText.innerText = "Signing In...";

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });
                if (error) throw error;

                showAlert("Logged in successfully! Redirecting...", "success");
                
                // Allow a brief moment for user feedback
                setTimeout(() => {
                    window.location.href = "dashbord.html";
                }, 1000);
                
            } catch (err) {
                showAlert(err.message || "An error occurred during authentication.");
                submitBtn.disabled = false;
                spinner.style.display = 'none';
                btnText.innerText = "Sign In";
            }
        });

        // SIGN UP SUBMIT
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertEl.style.display = 'none';

            const name = document.getElementById('signup-name').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;
            const submitBtn = document.getElementById('signup-submit-btn');
            const spinner = document.getElementById('signup-spinner');
            const btnText = document.getElementById('signup-btn-text');

            const supabase = window.supabaseClient;
            if (!supabase) {
                showAlert("Supabase client not initialized.");
                return;
            }

            if (!name) {
                showAlert("Please enter your full name.");
                return;
            }

            // Enter loading state
            submitBtn.disabled = true;
            spinner.style.display = 'block';
            btnText.innerText = "Creating Account...";

            try {
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            display_name: name
                        }
                    }
                });
                if (error) throw error;

                showAlert("Account created successfully! Redirecting...", "success");
                setTimeout(() => {
                    window.location.href = "dashbord.html";
                }, 1000);

            } catch (err) {
                showAlert(err.message || "An error occurred during registration.");
                submitBtn.disabled = false;
                spinner.style.display = 'none';
                btnText.innerText = "Create Account";
            }
        });

        // GOOGLE OAUTH FLOW
        const googleLoginBtn = document.getElementById('btn-google-login');
        if (googleLoginBtn) {
            googleLoginBtn.addEventListener('click', async () => {
                alertEl.style.display = 'none';
                const supabase = window.supabaseClient;
                if (!supabase) {
                    showAlert("Supabase client not initialized.");
                    return;
                }

                // Show spinner loading state
                googleLoginBtn.disabled = true;
                googleLoginBtn.innerHTML = `
                    <span class="spinner" style="display: block; border-top-color: var(--text-main);"></span>
                    <span>Connecting to Google...</span>
                `;

                try {
                    const redirectUrl = new URL('dashbord.html', window.location.href).href;
                    const { data, error } = await supabase.auth.signInWithOAuth({
                        provider: 'google',
                        options: {
                            redirectTo: redirectUrl
                        }
                    });
                    if (error) throw error;
                } catch (err) {
                    showAlert(err.message || "An error occurred during Google authentication.");
                    googleLoginBtn.disabled = false;
                    googleLoginBtn.innerHTML = `
                        <svg viewBox="0 0 24 24" width="24" height="24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
                        </svg>
                        <span>Sign in with Google</span>
                    `;
                }
            });
        }
    </script>
</body>
</html>
